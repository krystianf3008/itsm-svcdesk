# ai-generated: 70% - Claude Code drafted the scenarios, I found the exact firing minutes with promtool and reviewed them
# prometheus/alerts_test.yml - promtool unit tests of alerts.yml (MONITORING-SPEC.md M-20, M-21). Run with
#   docker run --rm -v "$PWD/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts_test.yml
#
# Both tests burn at twice each alert's threshold (14.4 * (1 - 0.99) = 0.144 for the fast alert, burnt at 0.288;
# 6 * (1 - 0.99) = 0.06 for the slow one, burnt at 0.12), with enough healthy history first to fill the alert's
# long_window. The exact first-firing evaluation was found with promtool itself (not computed by hand, as
# alerts.yml's comment recommends - rate()'s edge extrapolation makes the hand estimate L/2 + for off by a
# minute or two): KbSearchAvailabilityFastBurn's real rule first fires at t=102m; the mutants move that edge -
# `for + 5m` and `threshold x 1.5` push it later (not yet firing at 102m), `for - 5m` and `threshold / 1.5` pull
# it earlier (already firing at 101m) - so asserting not-firing at 101m and firing at 102m kills all four.
# Likewise KbSearchAvailabilitySlowBurn fires first at t=555m; 554m/555m is its edge.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # KbSearchAvailabilityFastBurn: burn_rate 14.4, long_window 1h, short_window 5m, for 2m, objective 0.99.
  # 600 requests/min (10/s) throughout; healthy (0 bad) for 71 samples (minutes 0-70, more than the 60 the long
  # window needs), then from minute 71 a sustained 28.8 % error rate (173 bad, 427 good per minute) - twice the
  # 14.4 % threshold - for 120 more minutes.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42427+427x119'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 173+173x119'
      # noise: another route and method, at the same combined rate, to catch a rule without a route filter
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/tickets/{ticket_id}", http_response_status_code="200"}'
        values: '0+600x189'
    alert_rule_test:
      # the lower edge: kills `for - 5m` and `threshold / 1.5`, which would already be firing here
      - eval_time: 101m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts: []
      # the upper edge: kills `for + 5m` and `threshold x 1.5`, which would not be firing yet
      - eval_time: 102m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "kb/search is burning its 30-day availability budget 14.4x faster than sustainable: page now"

  # KbSearchAvailabilitySlowBurn: burn_rate 6, long_window 6h, short_window 30m, for 5m, objective 0.99.
  # Healthy for 371 samples (minutes 0-370, more than the 360 the long window needs), then a sustained 12 % error
  # rate (72 bad, 528 good per minute) - twice the 6 % threshold - for 260 more minutes.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222528+528x259'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 72+72x259'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/tickets/{ticket_id}", http_response_status_code="200"}'
        values: '0+600x629'
    alert_rule_test:
      - eval_time: 554m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 555m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "kb/search is burning its 30-day availability budget 6x faster than sustainable: look before end of day"
