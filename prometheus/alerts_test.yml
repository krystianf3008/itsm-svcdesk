rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # EXAMPLE, for ExampleKbSearchErrorsSingleWindow in alerts.yml: delete the two together.
  # 10 requests per second (600 per minute), healthy for 70 minutes; from then on 40 % of them fail (twice the
  # example's 20 % threshold). The one-hour error ratio crosses 20 % at 100m and the alert is pending from then;
  # `for: 5m` makes it fire at 105m. Found with promtool, as above.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42360+360x60'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 240+240x60'
    alert_rule_test:
      # the lower edge: kills `for - 5m` and `threshold / 1.5`, which would already be firing here
      - eval_time: 104m
        alertname: ExampleKbSearchErrorsSingleWindow
        exp_alerts: []
      # the upper edge: kills `for + 5m` and `threshold x 1.5`, which would not be firing yet
      - eval_time: 105m
        alertname: ExampleKbSearchErrorsSingleWindow
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "EXAMPLE: more than 20 % of /kb/search requests failed over the last hour"

