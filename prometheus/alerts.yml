# ai-generated: 70% - Claude Code drafted the rules from slo.md's numbers, I reviewed the thresholds and windows
# prometheus/alerts.yml - SLO alerts for GET /kb/search (MONITORING-SPEC.md M-17 to M-21; slo.md declares these
# two under `alerts:`). Both are on the availability SLI, at different burn rates (M-16): a fast one that pages
# and a slow one that goes to chat. Every comparison compares against a constant written in the expr itself
# (M-18: burn_rate * (1 - objective), with slo.md's own numbers), so the checker's threshold mutants can find and
# scale it.
groups:
  - name: svcdesk-slo
    rules:
      - alert: KbSearchAvailabilityFastBurn
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[1h]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[1h]))
          ) > 14.4 * (1 - 0.99)
          and
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[5m]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[5m]))
          ) > 14.4 * (1 - 0.99)
        for: 2m
        labels:
          service: svcdesk
          slo: availability
          severity: P1
        annotations:
          summary: "kb/search is burning its 30-day availability budget 14.4x faster than sustainable: page now"

      - alert: KbSearchAvailabilitySlowBurn
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[6h]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[6h]))
          ) > 6 * (1 - 0.99)
          and
          (
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search", http_response_status_code=~"5.."}[30m]))
              /
            sum(rate(http_server_request_duration_seconds_count{job="svcdesk", http_route="/kb/search"}[30m]))
          ) > 6 * (1 - 0.99)
        for: 5m
        labels:
          service: svcdesk
          slo: availability
          severity: P2
        annotations:
          summary: "kb/search is burning its 30-day availability budget 6x faster than sustainable: look before end of day"
