# Course template - Lab 1 compose contract (API.md section 9).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need
# no network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # Lab 3 M-02; falls back to this value when unset
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    # Recommended, not required: a healthcheck makes "docker compose up --wait" wait for readiness.
    # python:3.13-slim has no curl, so this one uses Python. Adjust it if your image is not Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Stretch S3 (own tests): uncomment and adapt. The checker builds every image up front
  # (docker compose --profile tests build; a tests image that does not build costs S3, never Core), then runs
  #   docker compose --profile tests run --rm --build tests
  # (300 s cap) and requires exit code 0 and a last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10.
  # As written, the runner lives at src/tests/run.py (Dockerfile.example copies src/ to /app/src, so it is
  # importable as tests.run from /app/src); adjust command and working_dir if you keep the tests elsewhere.
  # depends_on with condition: service_healthy needs the healthcheck above (uncomment it too); otherwise
  # a cold run can race the service, so make your runner retry /health for a few seconds first.
  # Like svcdesk, the tests image is built before the grader blocks egress: install everything at build time.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # the tests read the service URL from this variable
    command: ["python", "-m", "tests.run"]   # runs the suite and prints the ITSMLAB-TESTS line last

  # Lab 3 (MONITORING-SPEC.md M-01): the course image, profile-less so the checker's `up --wait svcdesk kb-index`
  # starts it; the checker and the grader replace image and login with their own.
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: krystianf3008    # the GitHub login whose kb-index profile this measures (M-01)
    ports:
      - "8081:8080"                        # optional: /stats and /admin/degrade from the host
    # No healthcheck: the image has no shell, so a command-based check can never pass (L3-CORE-1.04).

  # Your own observability stack (compose profile "observability"); the checker never starts these.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  svcdesk-data:
