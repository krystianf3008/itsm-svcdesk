# alertmanager/alertmanager.yml - the routing tree (INCIDENT-SPEC.md I-04 to I-08).
global:
  resolve_timeout: 5m
route:
  receiver: chat                  # the root: P2 and P3 (and anything unmatched) land here
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  # While a P1 fires on a service, a P2 or P3 on the SAME service is muted: the on-call already has the page.
  # `equal: [service]` is the label that must match for the mute to apply; both CheckoutErrorRate and
  # CheckoutLatencyHigh (and every other rule in demo-alerts.yml) carry `service`, so the rule never falls back
  # to "missing from both" (the pitfall I-08 proves).
  - source_matchers: ['severity="P1"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [service]
