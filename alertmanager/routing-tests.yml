# alertmanager/routing-tests.yml - the cases that prove the routing tree (INCIDENT-SPEC.md I-06 to I-08).
routes:
  - labels: {alertname: CheckoutErrorRate, service: checkout, severity: P1}
    receivers: [pager]
  - labels: {alertname: ProductCatalogErrorRate, service: product-catalog, severity: P2}
    receivers: [chat]
  - labels: {alertname: KbSearchAvailabilityFastBurn, service: svcdesk, slo: availability, severity: P1}
    receivers: [pager]

inhibitions:
  # The equal-labels pair (I-08): same source, same alertname and severity on both targets, differing only in
  # `service` - the one label `equal` lists. The first target shares the source's service and is muted; the
  # second does not and stays active, proving the inhibition is not "mutes everything" (the pitfall of a label
  # missing from both alerts, which the published example's own placeholder illustrates).
  - source: {alertname: CheckoutErrorRate, service: checkout, severity: P1}
    target: {alertname: CheckoutLatencyHigh, service: checkout, severity: P2}
    inhibited: true
  - source: {alertname: CheckoutErrorRate, service: checkout, severity: P1}
    target: {alertname: CheckoutLatencyHigh, service: other, severity: P2}
    inhibited: false
